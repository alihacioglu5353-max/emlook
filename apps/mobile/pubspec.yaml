name: emlook
description: Emlook — emlakçıların portföy paylaştığı, eşleştiği ve komisyonunu online tahsil ettiği sosyal ağ.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.0

# Bağımlılıklar `flutter pub add` ile en güncel uyumlu sürümlere çözülür.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
