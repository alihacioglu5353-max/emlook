name: emlook
description: Emlook — emlakçıların portföy paylaştığı, eşleştiği ve komisyonunu online tahsil ettiği sosyal ağ.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.0

# Bağımlılıklar `flutter pub add` ile en güncel uyumlu sürümlere çözülür.
dependencies:
  dio: ^5.11.1
  file_picker: ^13.2.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
