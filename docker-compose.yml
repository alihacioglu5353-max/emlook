# Yerel geliştirme servisleri: `docker compose up -d`
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: emlook
      POSTGRES_PASSWORD: emlook
      POSTGRES_DB: emlook
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U emlook']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

volumes:
  pgdata:
